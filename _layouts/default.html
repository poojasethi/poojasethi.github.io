<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% if page.title %}{{ page.title }} · {{ site.name }}{% else %}{{ site.name }}{% endif %}</title>
	{% capture description %}{{ page.summary | default: site.description }}{% endcapture %}
	<meta name="description" content="{{ description | strip_newlines | escape }}">

	<!-- Open Graph -->
	<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}">
	<meta property="og:description" content="{{ description | strip_newlines | escape }}">
	<meta property="og:type" content="{% if page.layout == "post" %}article{% else %}website{% endif %}">
	<meta property="og:url" content="https://poojasethi.github.io{{ page.url | replace: 'index.html', '' }}">

	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">

	<!-- Syntax highlighting CSS -->
	<link rel="stylesheet" href="{{ site.baseurl }}/css/syntax.css">

	<!-- Custom CSS -->
	<link rel="stylesheet" href="{{ site.baseurl }}/css/main.css">

	<!-- Favicon -->
	<link rel="shortcut icon" type="image/x-icon" href="{{ site.baseurl }}/img/favicon.ico?">

	{% if page.layout == "post" %}
	<!-- KaTeX -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
	{% endif %}

	<!-- Prevent flash of wrong theme -->
	<script>
		(function() {
			var t;
			try { t = localStorage.getItem('theme'); } catch (e) {}
			if (t) document.documentElement.setAttribute('data-theme', t);
		})();
	</script>
</head>

<body>
	<div class="page">
		<header class="top">
			<a class="wordmark" href="{{ site.baseurl }}/">{{ site.name }}</a>
			<nav class="main" aria-label="Main">
				<a href="{{ site.baseurl }}/#research">Research</a>
				<a href="{{ site.baseurl }}/blog.html"{% if page.url == "/blog.html" or page.layout == "post" %} aria-current="page"{% endif %}>Writing</a>
				<a href="{{ site.baseurl }}/photos.html"{% if page.url == "/photos.html" %} aria-current="page"{% endif %}>Photos</a>
				<a href="{{ site.baseurl }}/resources/cv.pdf">CV</a>
				<button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
					<svg id="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
					<svg id="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-1-6h2v3h-2V3zm0 15h2v3h-2v-3zM3 11h3v2H3v-2zm15 0h3v2h-3v-2zM5.636 4.222l1.414 1.414-1.414 1.414L4.222 5.636l1.414-1.414zm12.728 12.728 1.414 1.414-1.414 1.414-1.414-1.414 1.414-1.414zM4.222 18.364l1.414-1.414 1.414 1.414-1.414 1.414-1.414-1.414zm14.142-14.142 1.414 1.414-1.414 1.414-1.414-1.414 1.414-1.414z"/></svg>
				</button>
			</nav>
		</header>

		<main>
			{{ content }}
		</main>

		<footer>&copy; {{ site.name }}. Made in sunny Seattle. Opinions are my own.</footer>
	</div>

	{% if page.layout == "post" %}
	<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
		onload="renderMathInElement(document.body, {
			delimiters: [
				{left: '$$', right: '$$', display: true},
				{left: '$', right: '$', display: false}
			]
		});"></script>
	{% endif %}
	<script>
		var btn = document.getElementById('theme-toggle');
		var sun = document.getElementById('icon-sun');
		var moon = document.getElementById('icon-moon');

		function isDark() {
			var t = document.documentElement.getAttribute('data-theme');
			if (t === 'dark') return true;
			if (t === 'light') return false;
			return window.matchMedia('(prefers-color-scheme: dark)').matches;
		}

		function update() {
			var dark = isDark();
			var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
			sun.style.display = dark ? 'block' : 'none';
			moon.style.display = dark ? 'none' : 'block';
			btn.setAttribute('aria-label', label);
			btn.title = label;
		}

		btn.addEventListener('click', function() {
			var next = isDark() ? 'light' : 'dark';
			document.documentElement.setAttribute('data-theme', next);
			try { localStorage.setItem('theme', next); } catch (e) {}
			update();
		});

		update();
	</script>
</body>

</html>
