---
layout: default
---
{% assign kind = page.categories | first | default: "personal" %}
<article>
	<header class="post-header">
		<h1>{{ page.title }}</h1>
		<p class="post-meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%b %-d, %Y' }}</time> · <a href="{{ site.baseurl }}/blog.html{% if kind == 'personal' %}#personal{% endif %}">{{ kind }}</a></p>
	</header>

	<div class="post">{{ content }}</div>
</article>
